[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "lyness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled lyn CLI runtime for the lyness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/XavierZhang/lyness"
Documentation = "https://github.com/XavierZhang/lyness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/XavierZhang/lyness/issues"
Source = "https://github.com/XavierZhang/lyness"

[project.scripts]
lyn = "lyness_runtime:main"

# Include the injected lyn executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/lyness_runtime/runtime/lyness-sdk-runtime-*",
  "src/lyness_runtime/runtime/lyness-sdk-runtime-*/**",
  "src/lyness_runtime/runtime/linux-*/**",
  "src/lyness_runtime/runtime/macos-*/**",
  "src/lyness_runtime/runtime/win-*/**",
]
exclude = ["src/lyness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/lyness_runtime"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
