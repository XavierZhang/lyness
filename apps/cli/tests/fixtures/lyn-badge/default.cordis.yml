- insert:
    # `lyn-base` carries the skill tool but not the filesystem provider or the
    # session working directory the skill registry resolves against: the fork
    # moved that plane into `lyn-module-execution` so a hosted deployment can
    # compose a runtime that executes nothing. This snapshot needs only those
    # two rows, named by path rather than by package so they resolve without
    # claiming a dependency `lyn-base` deliberately no longer declares. Built
    # entries, because this is the built-exports tier.
    - id: fs-local
      name: '../../../../../packages/fs/fs-local/lib/index.js'

    - id: working-directory
      name: '../../../../../packages/session/working-directory/lib/index.js'

- id: skill-filesystem
  config:
    watch: false

- id: session-telemetry-otel
  disabled: true
