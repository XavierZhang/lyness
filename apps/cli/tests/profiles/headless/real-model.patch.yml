# Test-only agent and persistence patch over the shipped base + headless
# profile. The shared driver owns the turn, so the product runner stays off.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-pro
        contextWindow: 128000
      - id: deepseek-v4-flash
        contextWindow: 128000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        # The configured platform's first model; llm-deepseek rejects a malformed DEEPSEEK_MODELS at load.
        model: !!js "(process.env.DEEPSEEK_MODELS ?? 'deepseek-v4-flash').split(',')[0].trim()"
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: !!js "process.env.LYNESS_SNAPSHOT === undefined ? 'zstd' : 'none'"
