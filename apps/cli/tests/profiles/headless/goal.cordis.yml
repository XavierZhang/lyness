# Add the persisted goal domain and its model-facing tools to the real one-shot app.
- id: base
  name: '@lyness/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: goal
            name: '@lyness/goal'
          - id: tool-goal
            name: '@lyness/tool-goal'
