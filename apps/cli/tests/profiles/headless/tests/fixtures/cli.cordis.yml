- id: cli-mock-llm
  name: '../../../../../../../packages/test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'

- id: base
  name: '@lyness/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@lyness/llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@lyness/agent-spine-demo'
        config:
          agents:
            - id: main
              provider: cli-mock
              model: cli-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          lynHome: './.lyn-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless headless-agent smoke.'
      - id: persistence
        name: '@lyness/session-persistence-jsonl'
        config:
          root: './.sessions'
