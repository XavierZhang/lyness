# Local endpoint and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  config:
    baseURL: !!js process.env.LYNESS_SNAPSHOT_BASE_URL
    thinking: enabled
    reasoningEffort: low
    # The server these cases run against sends a keep-alive every 60ms, so 150
    # left 90ms of slack and a slipped timer bought a retried request that the
    # request-count assertions then saw. The sibling pi-ai fixture already
    # carries 1000; no case here asserts this timeout firing.
    streamIdleTimeoutMs: 1000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
