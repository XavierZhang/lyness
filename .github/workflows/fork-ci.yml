# Fork-owned CI for custom/main.
#
# Upstream's ci.yml runs only on pull requests and targets upstream's
# enterprise runner pools (lyn-ubuntu-24-04-16core, lyn-windows-2025-16core).
# This fork commits to custom/main directly and has neither pool, so none of
# those jobs ever ran here: a Dependabot PR's coverage job queued for 24 hours
# waiting for a runner that does not exist. This workflow mirrors the useful
# ci.yml jobs on GitHub-hosted runners and triggers on push instead.
#
# Parallelism settings are scaled down from upstream's 16-core values for the
# 4-vCPU hosted runners. Windows-hosted minutes bill at twice the Linux rate.
#
# Not mirrored: publishing, upstream PR governance, docs deployment, and the
# real-API lanes. python-runtime needs the DEEPSEEK_API_KEY_EXTERNAL secret and
# hard-fails without it, so it runs only when the repository variable
# LYNESS_FORK_REAL_API is 'true'.
#
# The `fork-` prefix keeps this file out of every upstream merge.
name: Fork CI

on:
  push:
    branches: [custom/main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  LYNESS_TELEMETRY_DISABLED: '1'

# A newer push supersedes an older run; only the latest tip's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: node 24 / static
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LYNESS_GATE_CONCURRENCY: '3'
      LYNESS_GATE_FAIL_FAST: '1'
    steps:
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      # Complete history: the archived-notes gate reads the pre-push manifest.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      # Upstream passes the PR base; on push the trusted baseline is the tip
      # before this push. A new branch (all-zero `before`) and a manual dispatch
      # leave it unset, and the gate then compares against HEAD.
      - name: Resolve archive baseline
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != '0000000000000000000000000000000000000000' ]; then
            echo "LYNESS_ARCHIVE_BASE_REF=$BEFORE" >> "$GITHUB_ENV"
          fi

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run static gates
        run: pnpm run check:ci:static

  coverage:
    name: node 24 / coverage (linux)
    # x86_64 is required: prepare-ci-bubblewrap.sh installs an amd64 package.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LYNESS_COVERAGE_MAX_WORKERS: '3'
      LYNESS_COVERAGE_PARTITIONS: '2'
      LYNESS_GATE_CONCURRENCY: '2'
      LYNESS_GATE_FAIL_FAST: '1'
    steps:
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      # Upstream seeds this cache from its pull-request lane, which never runs
      # here. This job alone saves the Linux store for every Linux job; it saves
      # before coverage so a failing run still seeds the next one.
      - uses: actions/cache/save@v4
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run exhaustive coverage
        run: pnpm run check:ci:coverage

  bench:
    name: node 24 / benchmarks
    runs-on: ubuntu-24.04
    # Wall-clock budgets need an otherwise idle runner, so this job runs the
    # benchmark lane alone instead of joining a concurrent gate aggregate.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install benchmark browser and hosted dependencies
        run: pnpm --filter @lyness/lyn-benchmarks exec playwright install --with-deps chromium

      - name: Run performance benchmarks
        env:
          LYNESS_GATE_VERBOSE: '1'
        run: pnpm run check:ci:bench

  consumers:
    name: node 24 / snapshots and artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LYNESS_GATE_CONCURRENCY: '3'
      LYNESS_NODE_COMPAT_SKIP_TYPECHECK: '1'
      LYNESS_OXLINT_THREADS: '4'
      LYNESS_PUBLINT_CONCURRENCY: '4'
      LYNESS_WEB_SNAPSHOT_WORKERS: '2'
      LYNESS_GATE_FAIL_FAST: '1'
      LYNESS_SNAPSHOT_MAX_CONCURRENCY: '8'
    steps:
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP%/*}/ms-playwright" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - uses: actions/cache/restore@v4
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Install Playwright Chromium and hosted dependencies
        run: pnpm --filter @lyness/lyn-web-frontend exec playwright install --with-deps chromium

      # Upstream never saves this cache on a branch this fork builds.
      - uses: actions/cache/save@v4
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run compatibility, snapshot, and artifact gates
        run: pnpm run check:ci:consumers

  node-compat:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LYNESS_GATE_CONCURRENCY: '1'
      LYNESS_NODE_COMPAT_SKIP_TYPECHECK: '1'
      LYNESS_GATE_FAIL_FAST: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.19'
            name: node 22.19
          # Pinned inside 24.0-24.11.1: those releases carry the v1 internal
          # loader while reporting major 24; a bare `24` would retest v2.
          - node: '24.9'
            name: node 24.9
          - node: '26'
            name: node 26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          package-manager-cache: false

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run compatibility smokes
        env:
          LYNESS_BUILD_CLIENT_PROFILE: official
        run: pnpm run check:node-compat

      - name: Check Loader internal shape detection
        run: pnpm exec vitest run packages/boot/app-boot/tests/loader-shape.compat.spec.ts

  python-sdk:
    name: python 3.10 / keyless SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      - name: Run complete keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest

  # The reusable builder runs an installed-wheel real-API test on every
  # non-PR event and hard-fails when the secret is empty; it also pins
  # DEEPSEEK_BASE_URL to the official endpoint. Enable it by setting the
  # repository variable LYNESS_FORK_REAL_API to 'true' once the secret exists.
  python-runtime:
    name: python runtime / release-shaped matrix
    if: vars.LYNESS_FORK_REAL_API == 'true'
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      targets: node24-linux-x64,node24-win-x64
      ci: true
    secrets:
      DEEPSEEK_API_KEY_EXTERNAL: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}

  windows-build:
    name: windows node 24 / build
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      LYNESS_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      # Upstream's install step: pass --package-import-method=clone only on ReFS.
      - name: Install (immutable)
        shell: pwsh
        run: >-
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':');
          $fs = (Get-Volume -DriveLetter $drive).FileSystem;
          if ($fs -eq 'ReFS') {
            corepack pnpm install --frozen-lockfile --package-import-method=clone
          } else {
            pnpm install --frozen-lockfile
          }
      - name: Run blocking Windows builds
        shell: pwsh
        run: pnpm run check:ci:windows-blocking

  windows-coverage:
    name: windows node 24 / coverage
    runs-on: windows-2025
    # Upstream allows 120 minutes on 16 cores; the hosted runner has 4.
    timeout-minutes: 240
    env:
      LYNESS_COVERAGE_MAX_WORKERS: '3'
      LYNESS_COVERAGE_PARTITIONS: '2'
      LYNESS_COVERAGE_TEST_TIMEOUT_MS: '90000'
      LYNESS_GATE_CONCURRENCY: '2'
      LYNESS_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The coordinator weights partitions by measured durations once a
      # history exists; entries are immutable, so each run saves a new key.
      - name: Restore coverage duration history
        uses: actions/cache/restore@v4
        with:
          path: .coverage-times.json
          key: coverage-times-${{ github.run_id }}
          restore-keys: |
            coverage-times-
      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install (immutable)
        shell: pwsh
        run: >-
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':');
          $fs = (Get-Volume -DriveLetter $drive).FileSystem;
          if ($fs -eq 'ReFS') {
            corepack pnpm install --frozen-lockfile --package-import-method=clone
          } else {
            pnpm install --frozen-lockfile
          }
      - name: Run Windows coverage
        shell: pwsh
        run: pnpm run check:ci:coverage
      - name: Save coverage duration history
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .coverage-times.json
          key: coverage-times-${{ github.run_id }}

  windows-native-tests:
    name: windows node 24 / native tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install (immutable)
        shell: pwsh
        run: >-
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':');
          $fs = (Get-Volume -DriveLetter $drive).FileSystem;
          if ($fs -eq 'ReFS') {
            corepack pnpm install --frozen-lockfile --package-import-method=clone
          } else {
            pnpm install --frozen-lockfile
          }
      - name: Run Windows-specific native tests
        shell: pwsh
        run: >-
          pnpm exec vitest run
          --no-file-parallelism
          --testTimeout 90000
          packages/shell/tool-pwsh/tests/loader.spec.ts
          packages/workflow/workflow-worker-thread/tests/workflow-worker-thread.spec.ts
          packages/workflow/tool-ralph/tests/integration.spec.ts
          packages/subprocess/subprocess-local/tests/process-exit.spec.ts

  # Non-blocking, as upstream marks it: a red run here does not fail the workflow.
  windows-observational:
    name: windows node 24 / observational
    continue-on-error: true
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      LYNESS_PUBLINT_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install (immutable)
        shell: pwsh
        run: >-
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':');
          $fs = (Get-Volume -DriveLetter $drive).FileSystem;
          if ($fs -eq 'ReFS') {
            corepack pnpm install --frozen-lockfile --package-import-method=clone
          } else {
            pnpm install --frozen-lockfile
          }
      - name: Run Windows observational gates
        shell: pwsh
        run: pnpm run check:ci:windows-observational
