# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@lyness/lyn-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@lyness/lyn-session-persistence-jsonl'
  config:
    root: !!js lynHomePath('sessions')
    compression: none

- id: sandbox
  name: '@lyness/lyn-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@lyness/lyn-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                toolUpdate: in-history
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
                toolUpdate: in-history
              - id: deepseek-v4-pro

- insert:
    - id: office-kit
      name: '@lyness/lyn-office-kit'
      config:
        outputDirectory: !!js lynHomePath('office-kit', 'outputs')

    - id: tool-office
      name: '@lyness/lyn-tool-office'

    - id: workspace-dependencies
      name: '@lyness/lyn-tool-workspace-dependencies'
      config:
        source: !!js process.cwd() + '/runtime-source'
        root: !!js process.cwd() + '/runtime-installed'

    - id: skill-office
      name: '@lyness/lyn-skill-office'
      disabled: false
      config:
        assetRoot: !!js process.cwd() + '/office-skills'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

- id: ptc-runtime
  config:
    launch:
      kind: node-script
      executable: !!js process.cwd() + '/office-ptc-node'
