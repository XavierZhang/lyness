- insert:
    - id: mcp-resource-catalog
      name: '@lyness/lyn-mcp-client'
      config:
        transport: stdio
        serverName: catalog
        command: !!js process.execPath
        args: !!js '[process.env.LYNESS_MCP_RESOURCES_FIXTURE]'
        failOnStartupError: true
        reconnect:
          enabled: false

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false
