- insert:
    - id: office-kit
      name: '@lyness/lyn-office-kit'
      config:
        outputDirectory: !!js lynHomePath('office-kit', 'outputs')

    - id: tool-office
      name: '@lyness/lyn-tool-office'

    - id: skill-office
      name: '@lyness/lyn-skill-office'
      disabled: false
      config:
        assetRoot: !!js process.cwd() + '/office-skills'
        pythonEnvironment: user

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
