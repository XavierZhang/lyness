# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-deepseek
  name: '@lyness/llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@lyness/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- insert:
    - id: terminal
      name: '@lyness/terminal'

- id: sandbox-policy
  name: '@lyness/sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@lyness/subprocess-local'

- insert:
    - id: terminal-pwsh
      name: '@lyness/terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@lyness/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@lyness/session-persistence-jsonl'
  config:
    root: !!js lynHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@lyness/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@lyness/system-prompt'
  config:
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@lyness/tool-jobs'
  disabled: true

- id: goal
  name: '@lyness/goal'
  disabled: true

- id: goal-round-driver
  name: '@lyness/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@lyness/command-goal'
  disabled: true

- id: tool-goal
  name: '@lyness/tool-goal'
  disabled: true

- id: skill
  name: '@lyness/skill'
  disabled: true

- id: skill-filesystem
  name: '@lyness/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@lyness/tool-skill'
  disabled: true

- id: tool-bash
  name: '@lyness/tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@lyness/tool-pwsh-persistent'
