# Minimal keyless composition: real app, bash, and search tool; replayed model.
- id: llm-deepseek
  name: '@lyness/llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@lyness/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@lyness/subprocess-local'

- id: agent-default-model
  name: '@lyness/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@lyness/session-persistence-jsonl'
  config:
    root: !!js lynHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@lyness/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@lyness/system-prompt'
  config:
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@lyness/tool-jobs'
  disabled: true

- id: goal
  name: '@lyness/goal'
  disabled: true

- id: goal-round-driver
  name: '@lyness/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@lyness/command-goal'
  disabled: true

- id: tool-goal
  name: '@lyness/tool-goal'
  disabled: true

- id: skill
  name: '@lyness/skill'
  disabled: true

- id: skill-filesystem
  name: '@lyness/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@lyness/tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@lyness/tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@lyness/spill-local'
  config:
    root: !!js process.env.LYNESS_SNAPSHOT_SPILL_ROOT ?? './.spill'
