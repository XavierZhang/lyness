# With 1,800 tokens of headroom, a 1,000-token output reservation lowers the
# trigger from 6,980 to 5,980, between the history and its condensed replacement.


- id: agent-instructions
  disabled: true

- id: llm-deepseek
  name: '@lyness/lyn-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@lyness/lyn-session-persistence-jsonl'
  config:
    root: !!js lynHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@lyness/lyn-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@lyness/lyn-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 8780
                defaultMaxTokens: 1000
    - id: compaction-working-directory
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/compaction-working-directory.ts'

# Fixed-budget compaction scenario: keep the recorded tool set, whose token counts the thresholds were tuned to.
- id: tool-fs
  config:
    applyPatch: false
