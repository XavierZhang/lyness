# Opt-in sidebar terminal composition for the terminal panel snapshot scenario.
# The fixture stands in for the Web terminal controller with one user terminal.
- insert:
    - id: terminal-controller-fixture
      name: './terminal-controller-fixture.mjs'
    - id: optional-persistent-terminals
      name: cordis:group
      group: true
      isolate:
        terminals: true
      config:
        - id: pty
          name: '@lyness/lyn-terminal'
        - id: terminal-panel
          name: '@lyness/lyn-terminal-panel'
        - id: tool-terminal
          name: '@lyness/lyn-tool-terminal'
