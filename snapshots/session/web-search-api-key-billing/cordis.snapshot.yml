# Keyless replay counterpart: the account stand-in and Search endpoint remain real; only the model adapter is
# replaced by replay.
- id: llm-deepseek
  name: '@lyness/lyn-llm-deepseek-api-key'
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@lyness/lyn-llm-replay'
      config:
        providers:
          - id: snapshot-other
            name: Other provider
            models:
              - id: other-model

    - id: web-search-billing-fixture
      name: '../web-search-account-billing/web-search-billing-fixture.mjs'

- id: web-deepseek-api
  name: '@lyness/lyn-web-deepseek-api'
  config:
    searchBilling: api-key
