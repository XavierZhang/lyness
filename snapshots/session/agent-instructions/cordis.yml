# Workspace-context snapshot patch: the harness exports LYNESS_HOME=<cwd>/.lyn and
# LYNESS_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@lyness/lyn-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@lyness/lyn-session-persistence-jsonl'
  config:
    root: !!js lynHomePath('sessions')
    compression: !!js 'process.env.LYNESS_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@lyness/lyn-agent-instructions'
  config:
    maxBytes: 65536
    projectRootMarkers:
      - .lyn-project

- id: system-prompt
  name: '@lyness/lyn-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
