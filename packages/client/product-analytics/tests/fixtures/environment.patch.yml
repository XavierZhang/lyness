- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@lyness/lyn-host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.LYNESS_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: lyn-environment-test
        serviceVersion: synthetic-release
        compression: none
    - id: product-analytics
      name: '@lyness/lyn-client-product-analytics'
      config:
        enabled: true
        appVersion: synthetic-release

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.LYNESS_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
