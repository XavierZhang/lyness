- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@lyness/lyn-host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.LYNESS_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: lyn-telemetry-test
        serviceVersion: !!js process.env.LYNESS_APP_VERSION
        compression: gzip
        scheduledDelayMillis: 60000
