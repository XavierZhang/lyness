# The dsh-web-app bundle patch: the browser surface over the dsh-base layer.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web-runtime row
# validates the advertised public URL; Connection reads invocation authorities
# directly from `webStartup`.
# `dsh --profile web --help` provides no `webStartup`, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

# Off in the product people use. The log rides the model request as
# `dsh_session_log`, so it reaches whoever serves the official model API rather
# than this project, and a product shipped under its own brand does not send
# its users' sessions to an upstream vendor by default. `dsh-base` keeps the
# uploader composed, so a deployment that wants it flips this one field
# ([ledger](../../../CUSTOM.md)).
- id: session-log-deepseek
  config:
    enabled: false

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `dsh.client` rows are the browser roster the modules node half scans into
# window.__DSH_BOOT__; the modules row is simultaneously a host row.
- insert:
    - id: desktop-product-telemetry
      name: '@deepseek-ai/dsh-host-product-telemetry-otel'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"
      config:
        scheduledDelayMillis: 30000
        timeoutMillis: 15000
        exportTimeoutMillis: 20000
        shutdownTimeoutMillis: 2000
        serviceName: deepseek-harness-desktop
        serviceVersion: !!js process.env.DSH_CLIENT_VERSION
        endpoint: !!js process.env.DSH_PRODUCT_ANALYTICS_OTLP_URL

    - id: product-analytics
      name: '@deepseek-ai/dsh-client-product-analytics'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"
      config:
        enabled: true
        appVersion: !!js process.env.DSH_CLIENT_VERSION

    # Host-owned authorization sampled at Agent creation. The Plugins page
    # edits this settings namespace independently of the selected preset.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    # Session-menu application choices over Host resolution on macOS, Windows,
    # and Linux. An empty catalog hides the action. The Host routes and browser
    # controls also serve the file-tree directory opener.
    - id: open-in-app
      name: '@deepseek-ai/dsh-host-open-in-app'
      config:
        probeTimeoutMs: 10000
        iconTimeoutMs: 10000
        launchWatchMs: 1000

    - id: ui-file-actions
      name: '@deepseek-ai/dsh-client-ui-file-actions'
    - id: ui-context-menu
      name: '@deepseek-ai/dsh-client-ui-context-menu'
    - id: ui-open-in-app
      name: '@deepseek-ai/dsh-client-ui-open-in-app'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Whole-log turn outline for the chat turn rail (the turnOutline
    # projection key): every turn stays navigable before its events page in.
    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching dual-face directory picker. Mount -native or -browse directly in
    # an overlay to pin the interaction.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # One background job's observation record streamed over Typert Remote;
    # the roster rides the session control stream above.
    - id: job-controller
      name: '@deepseek-ai/dsh-api-job-controller'
    # Workspace file service: bounded read, directory listing, and the
    # agent-write change feed inside the session workspace root.
    - id: terminal-controller
      name: '@deepseek-ai/dsh-api-terminal-controller'
    - id: workspace-files
      name: '@deepseek-ai/dsh-api-workspace-files'

    # The Schedule service owns the task store and delivers each due occurrence
    # as a follow-up to the task's target Session. The clock reading and the four
    # reminder tools belong to the `standard`, `cordis`, and `ptc` presets,
    # which declare them in their own scope.
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # Configuration-surface reads and writes over Typert Remote. Each method
    # reports an actionable error when its settings-domain provider is absent.
    - id: ui-settings-account
      name: '@deepseek-ai/dsh-client-ui-settings-account'
      config:
        # Open on the sign-in screen rather than on a product whose every
        # surface is about to refuse. An installation that already reaches a
        # model — a configured provider, or a key from the environment — is
        # usable and is not covered.
        requireSignIn: true

    - id: ui-account-notifications
      name: '@deepseek-ai/dsh-client-ui-account-notifications'

    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    # What this deployment has announced, read-only. Written where the
    # deployment is configured, so a desktop install and a browser each read
    # whatever their own server publishes.
    - id: announcements
      name: '@deepseek-ai/dsh-announcements/static'

    - id: announcement-controller
      name: '@deepseek-ai/dsh-api-announcement-controller'

    # The credits namespace. It mounts on every deployment, metered or not: a
    # deployment with no ledger answers `credits/unavailable`, which is what
    # lets the Settings section say so instead of showing an empty balance.
    - id: credits-controller
      name: '@deepseek-ai/dsh-api-credits-controller'

    # Who the viewer is, and what this deployment would let them sign in with.
    # It mounts on every deployment, with accounts or without: a surface has
    # to ask before it can know which of the two it is rendering.
    - id: identity-controller
      name: '@deepseek-ai/dsh-api-identity-controller'

    # What a person tells their own agents, kept for them and recorded on
    # every session they open. It mounts on every deployment: the shape with
    # no accounts has one operator, who has instructions of their own like
    # anybody else.
    - id: personal-instructions
      name: '@deepseek-ai/dsh-personal-instructions'

    - id: personal-instructions-controller
      name: '@deepseek-ai/dsh-api-personal-instructions-controller'

    # Deleting one's own conversation: the stored logs and what was cached
    # about them. It mounts on every deployment, with accounts or without,
    # because a conversation belongs to whoever opened it in both shapes.
    - id: session-deletion
      name: '@deepseek-ai/dsh-session-deletion'

    - id: session-data-controller
      name: '@deepseek-ai/dsh-api-session-data-controller'
    # One shared MCP server fleet: Settings-configured servers plus servers
    # that installed plugins register, with status and recovery over Remote.
    # Credential templates and OAuth grants resolve through the credentials
    # provider, so the manager starts after it.
    - id: mcp-manager
      name: '@deepseek-ai/dsh-mcp-manager'
      inject: [credentials]

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # The Host inspect providers are process-global: the registry rejects a
    # duplicate id, so they register here once and every preset's `tool-cordis`
    # row reads them.
    - id: cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@deepseek-ai/dsh-web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served
    # by the web-runtime row below through the fallback seat. Routing and
    # browser-facing asset paths do not depend on the advertised URL, which the
    # web-runtime row owns; Connection reads trust authorities from webStartup.
    # This row rejects wildcard binds.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        tls: !!js ctx.webStartup.tls
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # The deployment's own visual identity, mounted with nothing set: a served
    # page keeps the built-in brand until a deployment's patch layer fills this
    # row. Composition rather than user settings, because settings outrank
    # composition and a deployment pins its identity against the people using
    # it; this row registers no settings section, so nothing below the
    # application reaches it. Applied per index response, so changing it is a
    # patch edit and a restart, not a frontend rebuild.
    - id: brand-deployment
      name: '@deepseek-ai/dsh-host-brand-deployment'

    # Web glue owned by this bundle: resolves the built frontend dist (an
    # assembly fact of dsh-web-app, never user config), mounts the
    # frontend-static fallback owner and registers the bash runtime variable.
    # Providers contribute entry URLs; this row owns printing and browser handoff.
    # Invocation-only values come from webStartup; the advertised URL is
    # this row's `publicUrl`, otherwise the bind-address URL.
    - id: web-runtime
      name: '@deepseek-ai/dsh-web-app'
      inject: [webStartup]
      config:
        publicUrl: !!js ctx.webStartup.publicUrl
        surfaceContext: true
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        # The administration console is a page of its own, so this path
        # answers with the application document; the `ui-admin-console` row
        # below states that the same path is the console's.
        documentPaths:
          - /admin
          # And the page an invitation link opens: whoever follows one has no
          # account here yet, so it is a page of its own rather than the
          # workbench with a notice on top. The `ui-join` row below states
          # that the same path carries an invitation.
          - /join

    # Model context for an agent that inspects or extends the harness serving
    # this GUI: value-free prompt sections plus the current checkout and GUI
    # URL as optional runtime context. A complete agent-preset persona replaces
    # the sections, and a persona that suppresses optional runtime context
    # also drops the two value lines.
    - id: harness-dev-context
      name: '@deepseek-ai/dsh-harness-dev-context'

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@deepseek-ai/dsh-client-hmr'

    # ── browser plugin roster (dsh.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__DSH_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client. Every API
    # request and upgrade passes the loopback, listener-bind, or trustedHosts
    # policy; an advertised public URL contributes nothing to it.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [webStartup]
      config:
        # Keep invocation authorities (each --trusted-host value) when adding
        # deployment values, for example: ['app.internal', ...ctx.webStartup.trustedHosts].
        # The listener's bind IP is accepted separately from this list.
        trustedHosts: !!js ctx.webStartup.trustedHosts

    - id: authentication-token
      name: '@deepseek-ai/dsh-host-authentication-token'

    # Raw Blob and ReadableStream uploads run independently of Connection's
    # RPC and generation service.
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: shortcuts
      name: '@deepseek-ai/dsh-client-shortcuts'

    - id: ui-shortcuts
      name: '@deepseek-ai/dsh-client-ui-shortcuts'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'

    # Host reading records (ctx.sessionStatus) and the Session status table behind
    # ctx.uiSession.sessionStatus and useSessionStatus.
    - id: ui-session-status
      name: '@deepseek-ai/dsh-client-ui-session-status'

    # Unified resource model: protocol providers behind the useResource hook.
    - id: resources
      name: '@deepseek-ai/dsh-client-resources'

    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'

    # The right Sidebar: one docking surface per session over ui-dockkit.
    - id: ui-sidebar-right
      name: '@deepseek-ai/dsh-client-ui-sidebar-right'


    - id: office-kit
      name: '@deepseek-ai/dsh-office-kit'
      config:
        outputDirectory: !!js dshHomePath('office-kit', 'outputs')

    # Every profile uses the packaged Office skills. Desktop supplies their Python
    # environment through the primary runtime named by DSH_PRIMARY_RUNTIME and
    # selects `workspace-dependencies`. A Desktop profile launched without a
    # nonempty value disables workspace-dependencies and, like the other
    # profiles, selects `user` to direct the model to the user's Python.
    - id: workspace-dependencies
      name: '@deepseek-ai/dsh-tool-workspace-dependencies'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop' || !process.env.DSH_PRIMARY_RUNTIME"
      config:
        source: !!js process.env.DSH_PRIMARY_RUNTIME
        root: !!js dshHomePath('dsh-runtimes', 'dsh-primary-runtime')

    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      config:
        pythonEnvironment: !!js "ctx.get('profileContext')?.name === 'desktop' && process.env.DSH_PRIMARY_RUNTIME ? 'workspace-dependencies' : 'user'"

    # The right Sidebar's document tab: bounded file reads with selectable
    # Markdown, code, HTML, PDF, Office, and plain-text renderers.
    - id: ui-sidebar-documentpreview
      name: '@deepseek-ai/dsh-client-ui-sidebar-documentpreview'

    # Web profiles opt in; Desktop retains sandboxed HTTP(S) Browser tabs.
    - id: ui-sidebar-browser
      name: '@deepseek-ai/dsh-client-ui-sidebar-browser'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"

    - id: ui-sidebar-terminal
      name: '@deepseek-ai/dsh-client-ui-sidebar-terminal'
    # The right Sidebar's workspace file tree tab type.
    - id: ui-sidebar-files
      name: '@deepseek-ai/dsh-client-ui-sidebar-files'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    - id: ui-settings-announcements
      name: '@deepseek-ai/dsh-client-ui-settings-announcements'


    # Who the viewer is, read once and shared: the row naming whose session
    # this is, the sign-in screen, and the Settings navigation's plane split
    # all render from this one answer.
    - id: ui-viewer
      name: '@deepseek-ai/dsh-client-ui-viewer'

    # What a reader's agents may use, projected from the registries an agent
    # itself reads. It mounts here with the GUI because the page is its only
    # consumer; a headless deployment has nobody to show it to.
    - id: agent-capabilities-controller
      name: '@deepseek-ai/dsh-api-agent-capabilities-controller'

    # The administration console: /admin is a page of its own, with its own
    # navigation and its own sign-in screen, and every administration page
    # renders inside it rather than inside Settings. The workbench keeps what
    # a person decides for themselves; what somebody else decides for them is
    # here. The path matches the `documentPaths` entry on `web-runtime`: the
    # Host decides which paths carry a document, this decides which one is the
    # console.
    - id: ui-admin-console
      name: '@deepseek-ai/dsh-client-ui-admin-console'
      config:
        path: /admin

    # The page an invitation link opens: the directories that redeem the code
    # it carries, and nothing else — it asks this deployment nothing about the
    # code, because an answer on a page anybody can open would tell whoever
    # asked which codes exist. The path matches the `documentPaths` entry
    # above and the `joinPath` the administration page builds its links with.
    - id: ui-join
      name: '@deepseek-ai/dsh-client-ui-join'
      config:
        path: /join

    # The personal plane's read-only entry: the one answer to the question the
    # administration pages otherwise answer with a refusal notice.
    - id: ui-settings-capabilities
      name: '@deepseek-ai/dsh-client-ui-settings-capabilities'

    # The personal plane's memory page: what this deployment remembers about
    # the person reading it, and the removal they can ask for. The store is
    # the memory module's; without that module the namespace answers nothing
    # and the page says so.
    - id: ui-settings-memory
      name: '@deepseek-ai/dsh-client-ui-settings-memory'

    # The personal plane's instructions page: the person's own control over
    # what their agents are told, which nobody else sets for them.
    - id: ui-settings-instructions
      name: '@deepseek-ai/dsh-client-ui-settings-instructions'

    # The personal plane's data page: the conversations this person can open,
    # each with the copy they can take and the deletion they can ask for.
    - id: ui-settings-data
      name: '@deepseek-ai/dsh-client-ui-settings-data'

    # The sign-in screen, and the row naming whose session this is. On a
    # deployment with no accounts both render nothing, so the single-operator
    # shape sees no change.
    - id: ui-sign-in
      name: '@deepseek-ai/dsh-client-ui-sign-in'

    - id: ui-settings-models
      name: '@deepseek-ai/dsh-client-ui-settings-models'

    # Plugin management: the sidebar Plugins page installs, enables, disables,
    # and removes the profile's bundles through the `pluginManager` Remote.
    # Without a profile-backed Host it reports itself unavailable.
    - id: ui-plugin-manager
      name: '@deepseek-ai/dsh-client-ui-plugin-manager'

    # Read-only Plugin list tab in the Settings Plugins section; the built-in
    # bundles the sidebar page leaves out are inspected here.
    - id: ui-settings-plugin-inventory
      name: '@deepseek-ai/dsh-client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    - id: ui-approval
      name: '@deepseek-ai/dsh-client-ui-approval'

    - id: message-quotes
      name: '@deepseek-ai/dsh-message-quotes'

    - id: ui-chat
      name: '@deepseek-ai/dsh-client-ui-chat'

    # DeepSeek Harness occupants for the sidebar brand slots, the conversation
    # brand slot and the home frame layer, overridden per deployment by
    # brand-deployment's injected brand.
    - id: ui-brand-deepseek-harness
      name: '@deepseek-ai/dsh-client-ui-brand-deepseek-harness'

    - id: ui-attachment
      name: '@deepseek-ai/dsh-client-ui-attachment'

    - id: ui-file-drag
      name: '@deepseek-ai/dsh-client-ui-file-drag'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@deepseek-ai/dsh-client-ui-tool'

    - id: ui-cordis
      name: '@deepseek-ai/dsh-client-ui-cordis'

    - id: deliverable-file-references
      name: '@deepseek-ai/dsh-deliverable-file-references'

    # Turn tail: the changed-files card and delivery cards under each closing
    # assistant message. Remove this entry to turn the surface off; the tail
    # hole renders empty.
    - id: ui-deliverables
      name: '@deepseek-ai/dsh-client-ui-deliverables'

    # Records each top-level turn's changed files from git working-tree
    # snapshots; the changed-files card above renders its events.
    - id: workspace-changes
      name: '@deepseek-ai/dsh-workspace-changes'


    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'

    # Durable workflow lifecycle as an independent Chat node after the
    # existing generic workflow tool row.
    - id: ui-workflow-run
      name: '@deepseek-ai/dsh-client-ui-workflow-run'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the reference sources (ui-skill / ui-reference).
    - id: ui-input-trigger
      name: '@deepseek-ai/dsh-client-ui-input-trigger'

    - id: ui-commands
      name: '@deepseek-ai/dsh-client-ui-commands'
      config:
        # Permission and model are seats under the composer in this product,
        # so a menu row for each is a second way to the same place rather than
        # a capability. Both stay typable as `/权限` and `/模型`.
        menuHidden:
          - permission
          - model

    - id: ui-skill
      name: '@deepseek-ai/dsh-client-ui-skill'

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-client-ui-agent-team'

    - id: ui-subagent
      name: '@deepseek-ai/dsh-client-ui-subagent'

    - id: ui-reference
      name: '@deepseek-ai/dsh-client-ui-reference'

    # Display masking for recognized credentials in sent user text; remove
    # this entry to draw credentials as written.
    - id: ui-secret-mask
      name: '@deepseek-ai/dsh-client-ui-secret-mask'

    # Background jobs: the session-header roster with on-demand streaming
    # record panels over the session job-output service.
    - id: ui-jobs
      name: '@deepseek-ai/dsh-client-ui-jobs'

    # Task management and Session reminder catalog over the Host Schedule
    # service mounted above.
    - id: ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'

    # Goal surface: GoalBar in the input dock over the goal session projection.
    - id: ui-goal
      name: '@deepseek-ai/dsh-client-ui-goal'

    # The feedback surface: Like/Dislike in the assistant-message action
    # strip, the feedback dialog behind Dislike and /feedback with its
    # acknowledgement toast, over the messageFeedback and sessionFeedback Remotes.
    - id: ui-message-feedback
      name: '@deepseek-ai/dsh-client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@deepseek-ai/dsh-client-ui-model-selection'

    - id: ui-permission
      name: '@deepseek-ai/dsh-client-ui-permission-presets'

    # The agent-preset row in General settings: the default preset for
    # sessions created later. Absent a roster it renders nothing.
    - id: ui-agent-preset
      name: '@deepseek-ai/dsh-client-ui-agent-preset'
      config:
        # Plugin and skill authoring is what the development view is for, and
        # it is the view this composition offers; `cordis` stays backstage, so
        # pointing the authoring flow at it would leave every entry that starts
        # the flow permanently disabled.
        authoringPreset: build

    # Region-local More menus: pin or unpin plugin launchers and start a
    # plugin draft.
    - id: entry-customization
      name: '@deepseek-ai/dsh-client-ui-entry-customization'


    # The Built-in plugins settings section: the navigation entry and the tab
    # row the inventory tab registers into. The official configuration pages
    # are the companion rows below.
    - id: ui-settings-plugins
      name: '@deepseek-ai/dsh-client-ui-settings-plugins'

    # The official settings pages: one companion package per host-plane
    # namespace, each registering its page into the Plugins page while the
    # Host serves the namespace.
    - id: ui-settings-shell
      name: '@deepseek-ai/dsh-client-ui-settings-shell'

    - id: ui-settings-agent-loop
      name: '@deepseek-ai/dsh-client-ui-settings-agent-loop'

    - id: ui-settings-subagent
      name: '@deepseek-ai/dsh-client-ui-settings-subagent'

    - id: ui-settings-web-search
      name: '@deepseek-ai/dsh-client-ui-settings-web-search'

    # Plan control: the composer plan seat over the plan projection + /plan channel.
    - id: ui-plan
      name: '@deepseek-ai/dsh-client-ui-plan'

    - id: ui-user-questions
