# Agent preset work: everyday work, and the mode a new session starts in.
#
# It extends `standard` rather than restating it, so the capabilities the
# official mode gains in an upstream release reach this view with no edit here:
# its prompt, its tool set, its plan-mode text and its subagent options are
# upstream's current ones. Only the three rows below belong to this view. One
# `@deepseek-ai/dsh-agent-preset` declaration inserted after the web patch; edits
# saved from the Web editor override this row's `config.plugins` by id from the
# profile patch.
- insert:
    - id: preset-work
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: work
        # Everything `standard` mounts, in its order. The four ids the official
        # modes use stay as upstream shipped them; this view carries the
        # difference.
        extends: standard
        # A view default is where module bundles contribute their rows.
        acceptsContributions: true
        order: 1
        plugins:
          # `standard`'s persona plus the working directory, which a view used
          # from a workspace needs and a bare mode does not. The prefix is
          # restated because a replacement row replaces the whole row;
          # `shipped-presets.spec.ts` fails if it drifts from `standard`'s.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
              suffix: Your working directory is {{cwd}}.
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'
          # Composition belongs to the Settings pages in this product, not to
          # the model, so this view keeps the tools off unconditionally where
          # `standard` enables them for a profile run.
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
