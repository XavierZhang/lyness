# Agent preset build: development work, including skills and plugins.
#
# It extends `cordis` — the official mode that adds the harness-authoring tool
# to `standard`'s set — rather than restating it, so what that mode gains in an
# upstream release reaches this view with no edit here. Only the two rows below
# belong to this view. One `@deepseek-ai/dsh-agent-preset` declaration inserted
# after the web patch; edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
- insert:
    - id: preset-build
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: build
        # Everything `cordis` mounts, in its order: `standard`'s rows plus
        # `tool-cordis`, which is what makes this the view for writing skills
        # and plugins.
        extends: cordis
        # A view default is where module bundles contribute their rows.
        acceptsContributions: true
        order: 2
        plugins:
          # `cordis`'s persona plus the working directory, which a view used
          # from a workspace needs and a bare mode does not. The prefix is
          # restated because a replacement row replaces the whole row;
          # `shipped-presets.spec.ts` fails if it drifts from `cordis`'s.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
              suffix: Your working directory is {{cwd}}.
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'
