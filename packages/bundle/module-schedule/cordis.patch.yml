# The scheduled follow-ups module, as its own bundle rather than rows inside
# the surface bundle. Packaging it this way is what lets the platform ship a
# fix for this module without a release of the whole product
# (../../../.agents/notes/proposed/architecture/2026-10-08-default-modules-and-views.md).
#
# Both rows stay ON, as they are in the web patch this module was carved out
# of: moving a module must not change what a deployment ships. Disabling them
# here took the four `schedule_*` tools out of every Web and Desktop agent's
# catalog while the SDK surface kept its own inline rows, which is the
# asymmetry `apps/cli/tests/profiles/sdk/desktop-tools.expected.e2e.ts` reads
# as a tool mismatch and the Web expectations read as a missing RPC.
- insert:
    # Durable Host-wide reminders. The Schedule service owns the task store and
    # delivers each due occurrence as a follow-up in its original Session.
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # Task management and Session reminder catalog over the Host Schedule
    # service above.
    - id: ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'
