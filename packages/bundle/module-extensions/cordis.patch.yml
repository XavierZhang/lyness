# The runtime self-modification module, as its own bundle: the agent reading
# and editing the composition it is running in.
#
# Unlike the other default modules this one contributes no preset row. Its
# model-facing `tool-cordis` row stays declared by the presets that should
# carry it — upstream's creator mode and the developer view — because a
# contribution reaches every preset that accepts rows, and that would hand
# self-modification to the business view as well. The capability boundary is
# the reason, not the mechanism
# (../../../.agents/notes/proposed/architecture/2026-10-08-default-modules-and-views.md).
- insert:
    - id: cordis-host-runner
      name: '@lyness/lyn-cordis-host-runner'

    # The Host inspect providers are process-global: the registry rejects a
    # duplicate id, so they register here once and every preset's `tool-cordis`
    # row reads them.
    - id: cordis-inspect-providers
      name: '@lyness/lyn-tool-cordis/host'

    - id: cordis-client-runner
      name: '@lyness/lyn-cordis-client-runner'

    - id: ui-cordis
      name: '@lyness/lyn-client-ui-cordis'
