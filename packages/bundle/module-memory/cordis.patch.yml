# The durable memory module, as its own bundle. The Host service mounts here;
# its write tools reach the presets through the contribution seam rather than
# by restating a preset's whole row list
# (../../../.agents/notes/proposed/architecture/2026-10-10-preset-row-contributions.md).
#
# Both rows name `@lyness/lyn-memory`, which resolves wherever the service
# does. A bundle that named itself would also have to be resolvable as a
# module, which a patch-carrying bundle otherwise never needs to be.
- insert:
    - id: memory
      name: '@lyness/lyn-memory'

    - id: memory-preset-contribution
      name: '@lyness/lyn-memory/preset-contribution'

    # The Remote namespace a person reads their own memories through. It
    # mounts with the store rather than with the GUI, because without the
    # store there is nothing to serve; the Settings page injects the namespace
    # and therefore appears only where this module is selected.
    - id: memory-controller
      name: '@lyness/lyn-api-memory-controller'
