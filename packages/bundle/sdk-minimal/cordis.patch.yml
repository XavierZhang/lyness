# Standalone minimal SDK application. Unlike the ordinary SDK profile, this
# bundle does not layer over lyn-base: this insert is the complete Cordis tree.
# User profile, home, and invocation patches still apply above it.

- insert:
    - id: sdk-app-startup
      name: '@lyness/sdk-app'
      config:
        profile: sdk-minimal

    - id: sdk-jsonrpc-server
      name: '@lyness/sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: false

    - id: deepseek-llm-api-extensions
      name: '@lyness/deepseek-llm-api-extensions'

    - id: session-log-deepseek
      name: '@lyness/session-log-deepseek'

    - id: plugin-package-inventory-deepseek
      name: '@lyness/plugin-package-inventory-deepseek'

    - id: llm-deepseek
      name: '@lyness/llm-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        defaultContextWindow: !!js Number(process.env.LYNESS_CONTEXT_WINDOW ?? 1000000)
        streamIdleTimeoutMs: 172800000

    - id: sandbox
      name: '@lyness/sandbox-local'

    # Shared projection registry: sandbox-policy and terminal-bash fold
    # sandbox-mode state through its units and require it as a hard injection.
    - id: session-projection
      name: '@lyness/session-projection'

    - id: sandbox-policy
      name: '@lyness/sandbox-policy'
      config:
        mode: danger-full-access
        workspaceRoot: !!js process.cwd()

    - id: subprocess
      name: '@lyness/subprocess-local'

    - id: pty
      name: '@lyness/terminal'

    - id: terminal-bash
      name: '@lyness/terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@lyness/terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    # Keep the minimal agent kernel explicit: unlike lyn-base, this profile
    # owns each service row and omits every optional producer it does not use.
    - id: timer
      name: '@lyness/cordis-plugin-timer'

    - id: llm
      name: '@lyness/llm'

    - id: session
      name: '@lyness/session'

    - id: session-title
      name: '@lyness/session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: system-prompt
      name: '@lyness/system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: !!js process.env.LYNESS_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'

    - id: tools
      name: '@lyness/tools'

    - id: agent
      name: '@lyness/agent'

    - id: llm-retry
      name: '@lyness/llm-retry'

    - id: jobs
      name: '@lyness/jobs-local'

    - id: invariants
      name: '@lyness/invariants'

    - id: session-invariant
      name: '@lyness/session/invariant'

    - id: agent-invariant
      name: '@lyness/agent/invariant'

    - id: scope-invariant
      name: '@lyness/scope/invariant'

    - id: agent-loop-invariant
      name: '@lyness/agent-loop/invariant'

    - id: agent-loop
      name: '@lyness/agent-loop'
      config:
        agents: []

    - id: persistent-bash
      name: '@lyness/tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: persistent-pwsh
      name: '@lyness/tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

    - id: sessions
      name: '@lyness/session-persistence-jsonl'
      config:
        root: !!js lynHomePath('sessions')
        compression: none
