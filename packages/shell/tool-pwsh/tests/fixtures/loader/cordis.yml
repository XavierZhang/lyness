# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@lyness/lyn-system-prompt'

- id: fs
  name: '@lyness/lyn-fs-local'

- id: session-projections
  name: '@lyness/lyn-session-projection'

- id: working-directory
  name: '@lyness/lyn-working-directory'

- id: tools
  name: '@lyness/lyn-tools'

- id: tool-executor-native
  name: '@lyness/lyn-tool-executor-native'

- id: subprocess
  name: '@lyness/lyn-subprocess-local'

- id: bash
  name: '@lyness/lyn-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@lyness/lyn-shell-env'

- id: tasks
  name: '@lyness/lyn-jobs-local'

- id: tool-jobs
  name: '@lyness/lyn-tool-jobs'

- id: tool-pwsh
  name: '@lyness/lyn-tool-pwsh'
