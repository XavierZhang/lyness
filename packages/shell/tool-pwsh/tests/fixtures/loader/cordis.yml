# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@lyness/system-prompt'

- id: tools
  name: '@lyness/tools'

- id: subprocess
  name: '@lyness/subprocess-local'

- id: bash
  name: '@lyness/pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@lyness/shell-env'

- id: tasks
  name: '@lyness/jobs-local'

- id: tool-jobs
  name: '@lyness/tool-jobs'

- id: tool-pwsh
  name: '@lyness/tool-pwsh'
