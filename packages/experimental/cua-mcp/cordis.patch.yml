# The Computer Use MCP application: a standalone profile composed from this one
# insert over the empty profile root. No model turn ever runs here, so the
# composition carries no model adapter, prompt-side tools, telemetry, or
# session-management rows; stdout belongs exclusively to MCP JSON-RPC, and one
# stdio connection owns one Agent whose cua_run_code programs retain state until
# the client disconnects or calls cua_reset.
#
# Row ids match lyn-base where the plugin is the same, so a profile or home
# cordis.patch.yml written for a base-backed profile addresses them unchanged.

- insert:
    # Sessions: the connection Agent's Session log (nested tool/ptc-dispatch events
    # and screenshots) and the projections that approval, sandbox policy, and the
    # Agent registry derive from it.
    - id: session
      name: '@lyness/lyn-session'

    - id: session-persistence-jsonl
      name: '@lyness/lyn-session-persistence-jsonl'
      config:
        root: !!js lynHomePath('sessions')

    - id: session-projection
      name: '@lyness/lyn-session-projection'

    - id: attachment-local
      name: '@lyness/lyn-attachment-local'

    - id: working-directory
      name: '@lyness/lyn-working-directory'

    # Durable KV storage for the provider's application grants.
    - id: storage
      name: '@lyness/lyn-storage'

    - id: storage-json
      name: '@lyness/lyn-storage-json'
      config:
        root: !!js lynHomePath('storages')

    - id: storage-domain
      name: '@lyness/lyn-storage-domain'
      config:
        backend: json

    # Program processes: the dedicated CUA runtime launches under the same
    # file-effect boundary as every shipped CLI mode. A program's workspace-write
    # root is its Agent's working directory, which the cua-mcp row sets to the
    # workspace below; this row's root covers calls without a Session.
    - id: subprocess
      name: '@lyness/lyn-subprocess-local'

    - id: sandbox
      name: '@lyness/lyn-sandbox-local'

    - id: sandbox-policy
      name: '@lyness/lyn-sandbox-policy'
      config:
        mode: !!js process.env.LYNESS_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.env.LYNESS_CUA_WORKSPACE ?? lynHomePath('cua-mcp', 'workspace')

    - id: approval
      name: '@lyness/lyn-user-approval'
      config:
        policy: !!js "(process.env.LYNESS_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: fs-sandbox
      name: '@lyness/lyn-fs-sandbox'

    # Tool execution and the Agent that owns the connection.
    - id: tools
      name: '@lyness/lyn-tools'

    - id: tool-executor-native
      name: '@lyness/lyn-tool-executor-native'

    - id: system-prompt
      name: '@lyness/lyn-system-prompt'
      config:
        personaPrefix: ''

    - id: user-questions
      name: '@lyness/lyn-user-questions'

    # The Agent registry creates the connection Agent through the agent-loop
    # factory; no model adapter is mounted on the llm hub, so no turn can run.
    - id: llm
      name: '@lyness/lyn-llm'

    - id: agent
      name: '@lyness/lyn-agent'

    - id: agent-loop
      name: '@lyness/lyn-agent-loop'
      config:
        agents: []

    # A composed preset selects cua_run_code for the connection's Agent; the
    # empty preset keeps every model-facing row out of this profile.
    - id: cua-mcp-presets
      name: '@lyness/lyn-agent-preset-registry'
      config:
        default: cua-mcp

    - id: cua-mcp-preset
      name: '@lyness/lyn-agent-preset'
      config:
        id: cua-mcp
        plugins: []

    - id: cua-mcp-computer-use
      name: '@lyness/lyn-computer-use'

    # One native provider per Host: macOS, and native Windows (not WSL). Both
    # are optional dependencies that an installation on another platform can
    # lack, so each row is disabled off its own Host.
    # Screenshots target a fixed request image because no model route exists here.
    - id: cua-mcp-provider
      name: '@lyness/lyn-cua-macos'
      disabled: !!js process.platform !== 'darwin'
      config:
        agentPreset: ptc
        screenshotTarget:
          longEdge: 2048
          maxBytes: 2097152

    - id: cua-mcp-provider-windows
      name: '@lyness/lyn-cua-windows'
      disabled: !!js process.platform !== 'win32'
      config:
        agentPreset: ptc
        screenshotTarget:
          longEdge: 2048
          maxBytes: 2097152

    # LYNESS_CUA_CONSENT=allow grants application and pointer access without a human;
    # the default forwards each request to the MCP client as an elicitation.
    # LYNESS_CUA_WORKSPACE is the directory programs start in and may write under
    # workspace-write; the default stays inside the Harness home whatever
    # directory the client started the server in.
    - id: cua-mcp
      name: '@lyness/lyn-cua-mcp'
      config:
        consent: !!js process.env.LYNESS_CUA_CONSENT ?? 'elicit'
        workspace: !!js process.env.LYNESS_CUA_WORKSPACE ?? lynHomePath('cua-mcp', 'workspace')
